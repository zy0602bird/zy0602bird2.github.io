<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>再就业男团猜歌游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui,-apple-system,sans-serif;
        }
        body {
            background-color: #f4f0ec;
            padding: 24px 16px;
            max-width:700px;
            margin:0 auto;
        }
        .container{
            background:#ffffff;
            border-radius:20px;
            padding:30px 24px;
            box-shadow:0 4px 16px rgba(0,0,0,0.07);
        }
        h1{
            text-align:center;
            color:#2b2b2b;
            margin-bottom:24px;
            font-size:24px;
        }
        .info-row{
            display:flex;
            justify-content:space-between;
            font-size:16px;
            margin-bottom:18px;
        }
        .audio-box{
            margin:22px 0;
        }
        audio{
            width:100%;
        }
        #answerInput{
            width:100%;
            padding:14px 16px;
            border:1px solid #dddddd;
            border-radius:12px;
            font-size:16px;
        }
        .btn-wrap{
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            gap:10px;
            margin:18px 0;
        }
        button{
            padding:13px;
            border:none;
            border-radius:10px;
            font-size:15px;
            cursor:pointer;
        }
        .prev{background:#868686;color:#fff;}
        .submit{background:#4279c4;color:#fff;}
        .next{background:#579669;color:#fff;}
        .tip{
            text-align:center;
            min-height:26px;
            font-size:16px;
        }
        .right{color:#23a343;}
        .wrong{color:#d42f2f;}
        .song-list-title{
            margin-top:28px;
            padding-top:20px;
            border-top:1px solid #eee;
        }
        .song-item{
            display:flex;
            justify-content:space-between;
            padding:9px 12px;
            background:#f7f3f0;
            border-radius:8px;
            margin:6px 0;
            font-size:14px;
            align-items:center;
        }
        .del{
            background:#dd4b4b;
            color:#fff;
            padding:4px 8px;
            font-size:12px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>再就业男团猜歌</h1>
    <div class="info-row">
        <span>题目：<span id="cur">1</span>/<span id="total">0</span></span>
        <span>得分：<span id="score">0</span></span>
    </div>

    <div class="audio-box">
        <audio id="player" controls preload="auto">
    </div>

    <input id="answerInput" placeholder="输入歌曲名字进行答题">

    <div class="btn-wrap">
        <button class="prev" onclick="prev()">上一题</button>
        <button class="submit" onclick="checkAnswer()">确认答案</button>
        <button class="next" onclick="next()">下一题</button>
    </div>

    <div class="tip" id="tipText"></div>

    <div class="song-list-title">
        <h3>当前歌单</h3>
    </div>
    <div id="listDom"></div>
</div>

<script>
//20首指定曲目
let songList = JSON.parse(localStorage.getItem("reEmploymentGuessSong")) || [
    {name:"一个人",singer:"王栎鑫",src:"yigeren.mp3"},
    {name:"活该",singer:"再就业男团",src:"huogai.mp3"},
    {name:"快乐在哪里",singer:"再就业男团",src:"kuailezainali.mp3"},
    {name:"至少今天很快乐",singer:"再就业男团",src:"zhishaojintianhenkuaile.mp3"},
    {name:"嘉宾",singer:"张远",src:"jiabin.mp3"},
    {name:"坏习惯",singer:"苏醒",src:"huaixiguan.mp3"},
    {name:"壁上观",singer:"张远",src:"bishangguan.mp3"},
    {name:"雪落下的声音",singer:"陆虎",src:"xueluoxiadezhengsheng.mp3"},
    {name:"老东西",singer:"苏醒",src:"laodongxi.mp3"},
    {name:"半边山半边海",singer:"陈楚生/王铮亮",src:"banbianshanbanbianhai.mp3"},
    {name:"庙堂之外",singer:"陈楚生",src:"miaotangzhiwai.mp3"},
    {name:"看着我的眼睛说",singer:"张远",src:"kanzhewodeyanjingshuo.mp3"},
    {name:"相思病",singer:"陆虎",src:"xiangsibing.mp3"},
    {name:"不凡",singer:"王铮亮",src:"bufan.mp3"},
    {name:"最好的我们",singer:"王栎鑫",src:"zuihaodewomen.mp3"},
    {name:"像你这样的朋友",singer:"再就业男团",src:"xiangnizheyangdepengyou.mp3"},
    {name:"就好",singer:"王栎鑫",src:"jiuhao.mp3"},
    {name:"时间都去哪了",singer:"王铮亮",src:"shijiandouqunale.mp3"},
    {name:"获奖之作",singer:"陈楚生",src:"huojiangzhizuo.mp3"},
    {name:"做你的星光",singer:"苏醒",src:"zuonidexingguang.mp3"}
];

let index = 0;
let score = 0;

const audio = document.getElementById("player");
const curDom = document.getElementById("cur");
const totalDom = document.getElementById("total");
const scoreDom = document.getElementById("score");
const inputDom = document.getElementById("answerInput");
const tipDom = document.getElementById("tipText");
const listDom = document.getElementById("listDom");

function save(){
    localStorage.setItem("reEmploymentGuessSong",JSON.stringify(songList));
}

function render(){
    if(songList.length===0){
        tipDom.innerText="暂无歌曲";
        totalDom.innerText=0;
        return;
    }
    const item = songList[index];
    audio.src = item.src;
    curDom.innerText = index+1;
    totalDom.innerText = songList.length;
    inputDom.value = "";
    tipDom.innerHTML = "";
    renderList();
}

function renderList(){
    listDom.innerHTML = "";
    songList.forEach((s,i)=>{
        const div = document.createElement("div");
        div.className="song-item";
        div.innerHTML = `<span>${s.name} · ${s.singer}</span><button class="del" onclick="del(${i})">删除</button>`;
        listDom.appendChild(div);
    })
}

function del(i){
    songList.splice(i,1);
    if(index >= songList.length) index = songList.length-1;
    save();render();
}

function checkAnswer(){
    if(songList.length===0) return;
    const right = songList[index].name.trim().toLowerCase();
    const userAns = inputDom.value.trim().toLowerCase();
    if(userAns === right){
        tipDom.innerHTML = `<span class="right">✅回答正确！+10分</span>`;
        score +=10;
        scoreDom.innerText = score;
    }else{
        tipDom.innerHTML = `<span class="wrong">❌答错！正确歌名：${songList[index].name}</span>`;
    }
}

function prev(){
    audio.pause();
    index--;
    if(index < 0) index = songList.length-1;
    render();
}

function next(){
    audio.pause();
    index++;
    if(index >= songList.length) index = 0;
    render();
}

render();
</script>
</body>
</html>
